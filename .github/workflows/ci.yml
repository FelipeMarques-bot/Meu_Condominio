name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências Python
        run: pip install -r requirements-dev.txt

      - name: Instalar dependências Node
        run: npm ci

      - name: Compilar assets
        run: npm run build

      - name: Lint
        run: ruff check .

      - name: Checagem do Django
        run: python manage.py check

      - name: Checagem de deploy
        run: python manage.py check --deploy
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-9fK2mQ7xV4bN1sR8tY6uH3jL5pW0zA2cE7gI4oM8qS1dF6hJ3k"
          ALLOWED_HOSTS: "example.com"

      - name: Auditoria de dependências
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Análise estática de segurança
        run: |
          pip install bandit
          bandit -r apps config -ll -q

      - name: Testes
        run: python manage.py test --verbosity 1
