services:
  - type: web
    name: meu-condominio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: meu-condominio-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_PRIVATE_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_PUBLIC_DOMAIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: EMAIL_API_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TAREFAS_TOKEN
        generateValue: true
      - key: SITE_NOME
        value: Meu Condomínio
      - key: TRIAL_DIAS
        value: "14"
      - key: TRIAL_JANELA_DIAS
        value: "30"
      - key: ASSINATURA_DIAS
        value: "30"
      - key: CARENCIA_DIAS
        value: "5"
      - key: PLANO_PIX_CHAVE
        sync: false
      - key: PLANO_PIX_BENEFICIARIO
        sync: false
      - key: PLANO_PIX_CIDADE
        sync: false
      - key: PLANO_WHATSAPP
        sync: false
      - key: PLANO_WHATSAPP_MENSAGEM
        sync: false
      - key: PLANO_WHATSAPP_MENSAGEM_LANDING
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

databases:
  - name: meu-condominio-db
    plan: free
    databaseName: meu_condominio
    user: meu_condominio
