{% if reserva_bloqueada %}
  <div class="anim-aviso mb-7 rounded-3xl border-2 border-danger/45 bg-danger/12 p-5 shadow-[0_30px_64px_-38px_rgba(12,27,31,0.6)]" role="status" aria-live="polite">
    <div class="flex items-start gap-4">
      <span class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-danger text-paper">
        <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="min-w-0">
        <p class="text-[0.6rem] font-semibold uppercase tracking-[0.2em] text-danger">Reservas bloqueadas</p>
        <p class="mt-1 font-display text-2xl leading-tight text-ink">Não é possível reservar neste momento</p>
        <p class="mt-2 text-sm leading-relaxed text-muted">
          Entre em contato com o administrador ou síndico para saber o motivo.
        </p>
      </div>
    </div>
  </div>
{% endif %}
