{% if esperas_novas %}
  <div class="anim-aviso mb-7 space-y-3" role="status" aria-live="polite">
    {% for espera in esperas_novas %}
      <div class="overflow-hidden rounded-3xl border-2 border-ok/45 bg-ok/12 p-4 shadow-[0_30px_64px_-38px_rgba(12,27,31,0.6)] sm:p-5">
        <p class="text-[0.6rem] font-semibold uppercase tracking-[0.2em] text-ok">Vaga liberada</p>
        <p class="mt-1 font-display text-2xl leading-tight text-ink">Sua vaga liberou!</p>
        <p class="mt-2 text-sm font-semibold text-ink">{{ espera.local.nome }}</p>
        <p class="mt-1 text-sm text-muted">{{ espera.data|date:"d/m/Y" }} · {{ espera.unidade.rotulo }}</p>
        <div class="mt-4 flex flex-wrap items-center gap-2">
          <a href="{% url 'reservar' slug=condominio.slug local_slug=espera.local.slug %}?data={{ espera.data|date:'Y-m-d' }}" class="btn btn-primary px-4 py-2 text-xs">Reservar agora</a>
          <form method="post" action="{% url 'marcar_esperas_vistas' slug=condominio.slug %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-ghost px-4 py-2 text-xs">Entendi</button>
          </form>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
